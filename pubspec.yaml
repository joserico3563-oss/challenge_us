name: challenge_us
description: "La Recocha: retos diarios para tu bonche."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  permission_handler: ^12.0.3
  http: ^1.6.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/larecocha/backgrounds/
    - assets/larecocha/badges/
    - assets/larecocha/branding/
    - assets/larecocha/navigation/
    - assets/larecocha/shop/

  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
